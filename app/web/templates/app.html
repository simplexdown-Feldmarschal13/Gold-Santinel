{% extends "base.html" %}
{% block content %}
  <section class="space-y-3">
    <h2 class="text-2xl font-semibold">Chart Screenshot Analysis</h2>
    <p class="text-sm text-zinc-300 max-w-2xl">
      Upload a single chart screenshot. The engine extracts structure from pixels only (no price feed). If confidence is low, it returns <span class="font-semibold">NO TRADE</span>.
    </p>
  </section>

  <section class="mt-8 grid gap-6 md:grid-cols-2">
    <div class="rounded-xl border border-zinc-800 bg-zinc-900/30 p-5">
      <div class="text-sm font-semibold">Input</div>
      <form id="analyzeForm" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs text-zinc-400">Chart screenshot (PNG/JPG/WebP)</label>
          <input name="file" id="file" type="file" accept="image/*"
                 class="mt-1 w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm" required />
        </div>
        <div>
          <label class="block text-xs text-zinc-400">Timeframe (optional hint)</label>
          <select id="timeframeHint" class="mt-1 w-full rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm">
            <option value="">Auto-detect</option>
            <option value="MN1">Monthly (MN1)</option>
            <option value="W1">Weekly (W1)</option>
            <option value="D1">Daily (D1)</option>
            <option value="H4">H4</option>
            <option value="H1">H1</option>
            <option value="M15">M15</option>
            <option value="M5">M5</option>
          </select>
        </div>
        <button type="submit"
                class="rounded-md bg-white px-4 py-2 text-sm font-medium text-zinc-900 hover:bg-zinc-200">
          Analyze
        </button>
        <div id="status" class="text-xs text-zinc-400"></div>
      </form>
    </div>

    <div class="rounded-xl border border-zinc-800 bg-zinc-900/30 p-5">
      <div class="text-sm font-semibold">Output</div>
      <div id="output" class="mt-4 text-sm text-zinc-200 whitespace-pre-wrap"></div>
    </div>
  </section>

  <script>
    const form = document.getElementById('analyzeForm');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    function render(result) {
      const lines = [];
      lines.push(`Instrument: ${result.instrument}`);
      lines.push(`Status: ${result.status}`);
      lines.push(`Bias: ${result.bias.toUpperCase()}`);
      lines.push(`Confidence: ${result.confidence}%`);
      lines.push('');
      lines.push('Reasoning:');
      for (const r of result.reasoning || []) lines.push(`- ${r}`);
      lines.push('');
      lines.push('Features:');
      lines.push(`- Timeframe: ${result.features.timeframe ?? 'unknown'}`);
      lines.push(`- Phase: ${result.features.phase}`);
      lines.push(`- Slope: ${result.features.slope ?? 'n/a'}`);
      lines.push(`- Levels: ${result.features.key_levels.length}`);
      lines.push(`- Liquidity clusters: ${result.features.liquidity_pools.length}`);
      outputEl.textContent = lines.join('\n');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      outputEl.textContent = '';
      statusEl.textContent = 'Running analysis…';
      const file = document.getElementById('file').files[0];
      const tf = document.getElementById('timeframeHint').value;
      const fd = new FormData();
      fd.append('file', file);
      if (tf) fd.append('timeframe_hint', tf);

      try {
        const res = await fetch('/api/analyze', { method: 'POST', body: fd });
        const json = await res.json();
        if (!res.ok) {
          statusEl.textContent = 'Analysis failed.';
          outputEl.textContent = JSON.stringify(json, null, 2);
          return;
        }
        statusEl.textContent = 'Done.';
        render(json);
      } catch (err) {
        statusEl.textContent = 'Network error.';
        outputEl.textContent = String(err);
      }
    });
  </script>
{% endblock %}
