<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Gold Sentinel" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100">
    <div class="mx-auto max-w-5xl px-6 py-10">
      <header class="flex items-center justify-between">
        <a href="/" class="text-lg font-semibold tracking-wide">Gold Sentinel</a>
        <nav class="flex items-center gap-4 text-sm text-zinc-300">
          <a href="/app" class="hover:text-white">Application</a>
          <a href="/docs" class="hover:text-white">API</a>
        </nav>
      </header>

      <main class="mt-10">
        {% block content %}{% endblock %}
      </main>

      <footer class="mt-16 border-t border-zinc-800 pt-6 text-xs text-zinc-400">
        <div>Gold Sentinel is a decision-support system. Not financial advice.</div>
      </footer>
    </div>
  </body>
</html>
